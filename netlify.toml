[build]
  publish = "dist"
  command = "npm run build"

# SPA Redirect: Ensure all client routes fall back to /index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# MIME Type and Caching Headers for Vite Assets
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
